<!DOCTYPE html>
<html>
  <head>
    <base href="/">
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <title>HTL Cloud Files</title>
    <style>
      html { background: #f2f3f5; font-size: 16px; font-family: "San Francisco","Roboto","Arial",sans-serif; height: 100%;}
      body { text-align: center; padding-top: 50px; text-align: center; margin: 0; height: 100%; box-sizing: border-box;}
      h1 { font-weight: 200; line-height: 1em; font-size: 40px; }
      p { opacity: 0.8; font-size: 1.05em; }
      form { max-width: 450px; margin: 0 auto; padding: 0 10px; text-align: left; }
      button,.btn { padding: 11px 0px; width: 100%; background: #466372; color: white; margin-top: 10px; cursor: pointer; font-weight: bold; border: none; border-radius: 2px; box-shadow: 2px 2px 2px rgb(0 0 0 / 5%); }
      input:not([type="checkbox"]), textarea { display: block; margin: 8px 0; border: none; outline: none; padding: 13px 15px; box-shadow: 2px 2px 2px rgb(0 0 0 / 1%); min-width: 100%; max-width: 100%; max-height: 80px; box-sizing: border-box; border-radius: 2px; }
      input, textarea, body { color: #313538; }
      input, textarea, button { font-size: inherit; }
      /* theme (htl.css) applies too; placeholder rule inlined here for the test */
      input[name="user"]::placeholder {
          color: #9aa5a3;
          opacity: 1;
          font-weight: 400;
          font-style: italic;
          letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body class="common_response_page">
    <!-- exact Page() output shape for strategy username_and_password (with the injected script tag) -->
    <!-- script below mirrors login_htl.go: last-used cookie prefill only, NO vault/checkbox -->
    <form action="/api/session/auth/?action=redirect&amp;label=H-Laufwerk" method="post">
                <label>
                    <input type="text" name="user" value="" placeholder="atn\20172033" autocomplete="username" autofocus />
                </label>
                <label>
                    <input type="password" name="password" value="" placeholder="Password" autocomplete="current-password" />
                </label>
                <button>CONNECT</button>
            </form>
            <script>(function() {
    "use strict";
    var COOKIE = "htl-user";
    var form = document.querySelector("form[action]");

    if (!form) return;
    var $user = form.querySelector('input[name="user"]');
    if (!$user) return;

    /* Storage is NOT guaranteed on this page: the login form is served from
     * /api/session/auth/ and strict browser settings (blocked third-party
     * cookies/partitioned storage, extensions, private mode, Firefox ETP)
     * make ANY access to document.cookie throw "Access to storage is not
     * allowed from this context". That must never break the plain FTP
     * login: every cookie touch is gated behind a probe and wrapped in
     * try/catch. The htl-user cookie is a hint, NEVER a credential. */
    function probe(fn) { try { return fn() === true; } catch (e) { return false; } }
    var cookieOK = probe(function() {
        document.cookie = "__htl_probe__=1; max-age=3600; path=/; SameSite=Lax; Secure";
        var ok = document.cookie.indexOf("__htl_probe__=") !== -1;
        document.cookie = "__htl_probe__=; max-age=0; path=/"; return ok;
    });

    function getCookie(name) {
        if (!cookieOK) return "";
        try {
            var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
            return m ? decodeURIComponent(m[1]) : "";
        } catch (e) { return ""; }
    }
    function setCookie(name, value, days) {
        if (!cookieOK) return;
        try {
            document.cookie = name + "=" + encodeURIComponent(value) +
                "; max-age=" + (days * 86400) + "; path=/; SameSite=Lax; Secure";
        } catch (e) {}
    }

    // Keep the vault out of every storage tier: entries written by the
    // retired remember-password feature are purged on first load (plain
    // storage access — the tier probes above only apply to new writes).
    function purgeLegacyVault() {
        try {
            for (var i = window.localStorage.length - 1; i >= 0; i--) {
                var k = window.localStorage.key(i);
                if (k && k.indexOf("htl-vault:") === 0) window.localStorage.removeItem(k);
            }
        } catch (e) {}
        try {
            for (var j = window.sessionStorage.length - 1; j >= 0; j--) {
                var k2 = window.sessionStorage.key(j);
                if (k2 && k2.indexOf("htl-vault:") === 0) window.sessionStorage.removeItem(k2);
            }
        } catch (e) {}
        var last = getCookie(COOKIE);
        if (last) {
            try { document.cookie = ("htl-vault:" + last) + "=; max-age=0; path=/"; } catch (e) {}
        }
        try {
            if ("indexedDB" in window && indexedDB.deleteDatabase) {
                indexedDB.deleteDatabase("htl-vault-db");
            }
        } catch (e) {}
    }
    purgeLegacyVault();

    // 1 + submit: prefill last used; refresh the hint cookie on every login
    var last = getCookie(COOKIE);
    if (last && !$user.value) $user.value = last;

    form.addEventListener("submit", function() {
        if ($user.value) setCookie(COOKIE, $user.value, 365);
    });
})();</script>
</body>
</html>
