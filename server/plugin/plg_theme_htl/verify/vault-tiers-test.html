<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"><title>HTL login purge test (retired vault)</title></head>
  <body>
<script>
/* Purge-correctness test for the REMOVED remember-password feature
 * (offline, no PRF hardware needed): seeds fake legacy "htl-vault:*"
 * entries into every storage tier, runs the shipped script, and asserts
 * the login page (a) removed them everywhere and (b) STILL prefills the
 * last-used username from the htl-user cookie and refreshes it on submit.
 */
</script>
<script>
"use strict";
// minimal DOM shim for a bare page (no real login form here)
if (!document.querySelector("form[action]")) {
    var shimForm = document.createElement("form");
    shimForm.setAttribute("action", "x");
    var shimU = document.createElement("input"); shimU.name = "user"; shimForm.appendChild(shimU);
    document.body.appendChild(shimForm);
}

// seed LEGACY data in every tier + the hint cookie
localStorage.setItem("htl-vault:atn20172033", JSON.stringify({ iv: "x", data: "y", allowCredentials: [], t: 1 }));
sessionStorage.setItem("htl-vault:atn20172033", JSON.stringify({ iv: "x", data: "y", allowCredentials: [], t: 2 }));
document.cookie = "htl-vault:atn20172033=" + encodeURIComponent(JSON.stringify({ iv: "x", data: "y", t: 4 })) + "; path=/";
document.cookie = "htl-user=atn20172033; path=/";
indexedDB.open("htl-vault-db", 1).onupgradeneeded = function(ev) {
    ev.target.result.createObjectStore("kv");
};
</script>
<script>
// === the shipped script (mirror of login_htl.go — keep in sync) ===
(function() {
    "use strict";
    var COOKIE = "htl-user";
    var form = document.querySelector("form[action]");

    if (!form) return;
    var $user = form.querySelector('input[name="user"]');
    if (!$user) return;

    function probe(fn) { try { return fn() === true; } catch (e) { return false; } }
    var cookieOK = probe(function() {
        document.cookie = "__htl_probe__=1; max-age=3600; path=/; SameSite=Lax; Secure";
        var ok = document.cookie.indexOf("__htl_probe__=") !== -1;
        document.cookie = "__htl_probe__=; max-age=0; path=/"; return ok;
    });

    function getCookie(name) {
        if (!cookieOK) return "";
        try {
            var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)"));
            return m ? decodeURIComponent(m[1]) : "";
        } catch (e) { return ""; }
    }
    function setCookie(name, value, days) {
        if (!cookieOK) return;
        try {
            document.cookie = name + "=" + encodeURIComponent(value) +
                "; max-age=" + (days * 86400) + "; path=/; SameSite=Lax; Secure";
        } catch (e) {}
    }

    function purgeLegacyVault() {
        try {
            for (var i = window.localStorage.length - 1; i >= 0; i--) {
                var k = window.localStorage.key(i);
                if (k && k.indexOf("htl-vault:") === 0) window.localStorage.removeItem(k);
            }
        } catch (e) {}
        try {
            for (var j = window.sessionStorage.length - 1; j >= 0; j--) {
                var k2 = window.sessionStorage.key(j);
                if (k2 && k2.indexOf("htl-vault:") === 0) window.sessionStorage.removeItem(k2);
            }
        } catch (e) {}
        var last = getCookie(COOKIE);
        if (last) {
            try { document.cookie = ("htl-vault:" + last) + "=; max-age=0; path=/"; } catch (e) {}
        }
        try {
            if ("indexedDB" in window && indexedDB.deleteDatabase) {
                indexedDB.deleteDatabase("htl-vault-db");
            }
        } catch (e) {}
    }
    purgeLegacyVault();

    var last = getCookie(COOKIE);
    if (last && !$user.value) $user.value = last;

    form.addEventListener("submit", function() {
        if ($user.value) setCookie(COOKIE, $user.value, 365);
    });
})();
</script>
<script>
// === assertions ===
var results = {
    localCleared: !localStorage.getItem("htl-vault:atn20172033"),
    sessionCleared: !sessionStorage.getItem("htl-vault:atn20172033"),
    cookieCleared: document.cookie.indexOf("htl-vault%3A") === -1 && document.cookie.indexOf("htl-vault:") === -1,
    userPrefilled: document.querySelector('input[name="user"]').value === "atn20172033",
    cookieRefreshed: (function() {
        var u = document.querySelector('input[name="user"]');
        u.value = "atn20202345";
        u.form.dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
        return document.cookie.indexOf("atn20202345") !== -1;
    })(),
};
document.title = "done";
window.__results = results;
document.body.textContent = JSON.stringify(results, null, 2);
</script>
</body>
</html>
